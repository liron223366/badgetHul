<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<meta name="description" content="לוח הוצאות בחו״ל - ניהול תקציב נסיעות">
<title>לוח הוצאות בחו״ל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#f8f9fa;
    --panel:#f0f2f5;
    --panel2:#e9ecef;
    --panel3:#dee2e6;
    --flap:#ced4da;
    --flap-edge:#adb5bd;
    --accent:#0a1628;
    --accent-2:#1a2d4a;
    --accent-dim:#344a6e;
    --teal:#0d6efd;
    --teal-dim:#0a58ca;
    --text:#0a1628;
    --text-dim:#495057;
    --text-faint:#6c757d;
    --danger:#dc3545;
    --border:#dee2e6;
    --shadow: 0 8px 32px rgba(10,22,40,0.1);
    --shadow-sm: 0 4px 16px rgba(10,22,40,0.08);
    --shadow-glow: 0 0 40px rgba(13,110,253,0.15);
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1400px 600px at 15% -5%, rgba(13,110,253,0.05), transparent),
      radial-gradient(1100px 550px at 100% 5%, rgba(10,22,40,0.03), transparent),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    direction:rtl;
  }
  .app{max-width:1000px;margin:0 auto;padding:40px 24px 80px;}

  /* header */
  .app-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    flex-wrap:wrap;gap:20px;margin-bottom:28px;
    padding-bottom:24px;
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .app-header::after{
    content:'';position:absolute;bottom:-1px;left:0;right:0;
    height:1px;background:linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    opacity:0.3;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 6px 20px rgba(10,22,40,0.15);
  }
  .app-header h1{font-size:24px;font-weight:700;margin:0;letter-spacing:0.3px;}
  .trip-name-wrap{margin-top:8px;}
  .trip-name-wrap input{
    background:transparent;border:none;color:var(--text-dim);font-size:14px;
    padding:3px 0;width:300px;max-width:60vw;border-bottom:1px dashed transparent;
    transition:all 0.2s ease;
  }
  .trip-name-wrap input:hover, .trip-name-wrap input:focus{
    border-bottom-color:var(--accent-dim);outline:none;color:var(--text);
  }
  .home-select{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .home-select label{font-size:11px;color:var(--text-faint);letter-spacing:0.4px;text-transform:uppercase;}
  select, input, button{
    font-family:'Inter',sans-serif;
    background:var(--panel3);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 14px;
    font-size:14px;
    transition:all 0.2s ease;
  }
  select:focus, input:focus{
    outline:2px solid var(--accent-dim);outline-offset:1px;
    border-color:var(--accent-dim);
    box-shadow:0 0 0 4px rgba(10,22,40,0.1);
  }

  /* stat strip */
  .stat-strip{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;
  }
  @media (max-width:700px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
  .stat-card{
    background:linear-gradient(145deg, var(--panel2), var(--panel));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;box-shadow:var(--shadow-sm);
    position:relative;overflow:hidden;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .stat-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
  }
  .stat-card::before{
    content:'';position:absolute;top:0;right:0;width:3px;height:100%;
    background:linear-gradient(180deg, var(--accent), var(--teal));
    opacity:0.8;
  }
  .stat-card .stat-label{font-size:11px;color:var(--text-faint);margin-bottom:8px;letter-spacing:0.5px;text-transform:uppercase;}
  .stat-card .stat-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--text);direction:ltr;text-align:right;}
  .stat-card .stat-value.small{font-size:15px;font-family:'Inter',sans-serif;direction:rtl;text-align:right;color:var(--teal);}

  /* board */
  .board{
    background:linear-gradient(145deg, var(--panel2), var(--panel));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px 32px;
    margin-bottom:24px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .board::before{
    content:'';position:absolute;top:-1px;left:20px;right:20px;height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    opacity:0.4;
  }
  .board-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .board-label{font-size:13px;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase;}
  .refresh-btn{
    display:flex;align-items:center;gap:8px;font-size:12px;
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 16px;border-radius:24px;cursor:pointer;transition:all 0.2s ease;
  }
  .refresh-btn:hover{border-color:var(--accent-dim);color:var(--accent);background:rgba(10,22,40,0.05);transform:translateY(-1px);}
  .refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .flap-row{display:flex;gap:8px;justify-content:flex-start;direction:ltr;}
  .flap-tile{
    background:linear-gradient(180deg, var(--panel2), var(--panel3));
    border:1px solid var(--border);
    border-radius:10px;
    width:44px;height:62px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:32px;font-weight:700;
    color:var(--accent);
    position:relative;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), 0 4px 12px rgba(10,22,40,0.15);
    transition:transform 0.25s ease, opacity 0.25s ease;
  }
  .flap-tile::after{
    content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--flap-edge);
  }
  .flap-tile.flip{animation:flipnum 0.35s ease;}
  @keyframes flipnum{0%{transform:rotateX(0);opacity:1;}45%{transform:rotateX(90deg);opacity:0.3;}55%{transform:rotateX(90deg);opacity:0.3;}100%{transform:rotateX(0);opacity:1;}}
  .board-currency{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--text-dim);margin-right:12px;align-self:center;direction:ltr;font-weight:600;}

  .rate-ticker{
    display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:20px;
    border-top:1px solid var(--border);
  }
  .rate-chip{
    background:linear-gradient(145deg, var(--panel3), var(--panel2));border:1px solid var(--border);border-radius:11px;
    padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;
    display:flex;flex-direction:row;align-items:center;gap:8px;min-width:130px;direction:ltr;
    position:relative;overflow:hidden;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .rate-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .rate-chip::before{
    content:'';position:absolute;top:0;bottom:0;right:0;width:3px;background:linear-gradient(180deg, var(--teal), var(--teal-dim));
  }
  .rate-chip .pair{color:var(--text-faint);font-size:11px;}
  .rate-chip .val{color:var(--teal);font-weight:700;font-size:16px;}
  .rate-delete-btn{
    background:transparent;border:none;color:var(--text-faint);cursor:pointer;
    font-size:14px;padding:2px 6px;border-radius:4px;
    transition:all 0.2s ease;
  }
  .rate-delete-btn:hover{color:var(--danger);background:rgba(220,53,69,0.1);}
  .rate-empty{color:var(--text-faint);font-size:13px;}
  .loading-note{color:var(--text-faint);font-size:12px;margin-top:12px;}

  /* panels */
  .panel{
    background:linear-gradient(145deg, var(--panel2), var(--panel));border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 28px;margin-bottom:24px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .panel::before{
    content:'';position:absolute;top:-1px;left:20px;right:20px;height:1px;
    background:linear-gradient(90deg, transparent, var(--teal-dim), transparent);
    opacity:0.3;
  }
  .panel h2{font-size:17px;margin:0 0 18px;font-weight:600;color:var(--text);letter-spacing:0.3px;}
  .panel h2 .n{color:var(--text-faint);font-weight:400;font-size:13px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:5px;letter-spacing:0.3px;}
  .form-grid select, .form-grid input{width:100%;}
  .add-row{display:flex;justify-content:flex-end;margin-top:18px;gap:14px;align-items:center;}
  @media (max-width:600px){
    .form-grid{grid-template-columns:1fr;}
    .form-grid .full{grid-column:1;}
  }
  .btn-primary{
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    color:#ffffff;border:none;font-weight:700;
    padding:12px 28px;border-radius:11px;cursor:pointer;
    box-shadow:0 5px 18px rgba(10,22,40,0.2);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,22,40,0.3);}
  .btn-primary:active{transform:translateY(0);}
  .form-msg{font-size:12px;color:var(--danger);}
  .currency-add{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;}
  .currency-add input{width:85px;text-transform:uppercase;}
  .currency-add .btn-secondary{
    background:linear-gradient(145deg, var(--panel3), var(--panel2));border:1px solid var(--border);color:var(--text-dim);
    padding:9px 18px;border-radius:10px;cursor:pointer;transition:all 0.2s ease;
  }
  .currency-add .btn-secondary:hover{color:var(--accent);border-color:var(--accent-dim);transform:translateY(-1px);}

  /* breakdown */
  .breakdown-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;}
  @media (max-width:760px){.breakdown-grid{grid-template-columns:1fr;}}
  @media (max-width:600px){
    .app{padding:20px 16px 60px;}
    .app-header{flex-direction:column;align-items:flex-start;}
    .brand-mark{width:50px;height:50px;font-size:24px;}
    .stat-strip{grid-template-columns:1fr 1fr;}
    .ledger-item{grid-template-columns:50px 1fr auto auto 30px;gap:8px;font-size:12px;}
    .country-header{flex-direction:column;align-items:flex-start;gap:10px;}
    .country-stats{flex-direction:column;gap:5px;}
  }
  .breakdown-col h3{font-size:12px;color:var(--text-faint);margin:0 0 14px;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;}
  .bar-label{width:75px;flex-shrink:0;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:var(--panel3);border-radius:5px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg, var(--teal-dim), var(--teal));border-radius:5px;transition:width 0.4s ease;}
  .bar-val{font-family:'JetBrains Mono',monospace;color:var(--text);width:80px;text-align:left;flex-shrink:0;direction:ltr;font-size:12px;font-weight:600;}
  .cur-row{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--border);transition:background 0.2s ease;}
  .cur-row:last-child{border-bottom:none;}
  .cur-row .cur-name{color:var(--text-dim);}
  .cur-row .cur-amt{font-family:'JetBrains Mono',monospace;direction:ltr;text-align:left;font-weight:600;}

  /* ledger */
  .ledger-empty{color:var(--text-faint);font-size:14px;padding:28px 0;text-align:center;}
  .ledger-item{
    display:grid;grid-template-columns:60px 1fr auto auto 34px;gap:14px;align-items:center;
    padding:13px 6px;border-bottom:1px solid var(--border);font-size:13px;
    transition:background 0.2s ease;
  }
  .ledger-item:hover{background:rgba(10,22,40,0.03);}
  .ledger-item:last-child{border-bottom:none;}
  .ledger-date{color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:12px;}
  .ledger-mid{display:flex;flex-direction:column;gap:4px;}
  .ledger-tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .ledger-cat{
    font-size:11px;color:var(--teal);border:1px solid var(--teal-dim);border-radius:22px;
    padding:2px 10px;background:rgba(13,110,253,0.08);
  }
  .ledger-country{font-size:11px;color:#ff8a65;}
  .ledger-note{color:var(--text-dim);font-size:12px;}
  .ledger-orig{font-family:'JetBrains Mono',monospace;color:var(--text-dim);font-size:12px;direction:ltr;text-align:left;}
  .ledger-conv{font-family:'JetBrains Mono',monospace;font-weight:700;direction:ltr;text-align:left;color:var(--text);}
  .del-btn{
    background:transparent;border:none;color:var(--text-faint);cursor:pointer;font-size:17px;
    padding:3px 8px;border-radius:8px;transition:all 0.2s ease;
  }
  .del-btn:hover{color:var(--danger);background:rgba(220,53,69,0.1);transform:scale(1.1);}

  .footer-note{color:var(--text-faint);font-size:12px;text-align:center;margin-top:10px;line-height:1.8;opacity:0.8;}

  /* country sections */
  .country-section{
    margin-bottom:24px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:linear-gradient(145deg, var(--panel2), var(--panel));
    overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .country-header{
    background:linear-gradient(145deg, var(--panel3), var(--panel2));
    padding:16px 20px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background 0.2s ease;
  }
  .country-header:hover{background:linear-gradient(145deg, var(--panel3), var(--panel2));}
  .country-name{
    font-size:16px;font-weight:600;color:var(--accent);
    display:flex;align-items:center;gap:10px;
  }
  .country-flag{
    width:24px;height:18px;border-radius:4px;
    background:linear-gradient(135deg, var(--accent), var(--teal));
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#ffffff;
    font-weight:700;
  }
  .country-stats{
    display:flex;gap:20px;font-size:13px;
  }
  .country-stat{
    color:var(--text-dim);
  }
  .country-stat .val{
    font-family:'JetBrains Mono',monospace;
    color:var(--text);font-weight:600;direction:ltr;
  }
  .country-content{
    padding:0;
    max-height:2000px;
    overflow:hidden;
    transition:max-height 0.3s ease, padding 0.3s ease;
  }
  .country-content.collapsed{
    max-height:0;
  }
  .country-content .ledger-item:first-child{border-top:none;}
  .country-content .ledger-item{border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <div>
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <h1>לוח הוצאות בחו״ל</h1>
      </div>
      <div class="trip-name-wrap">
        <input type="text" id="tripName" placeholder="הוסף שם לטיול (למשל: טיול לתאילנד 2026)">
      </div>
    </div>
    <div class="home-select">
      <label>מטבע הבית שלי</label>
      <select id="homeCurrency"></select>
    </div>
  </div>

  <div class="stat-strip">
    <div class="stat-card">
      <div class="stat-label">מספר הוצאות</div>
      <div class="stat-value" id="statCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">הוצאה ממוצעת</div>
      <div class="stat-value" id="statAvg">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">קטגוריה מובילה</div>
      <div class="stat-value small" id="statTopCat">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">מדינה מובילה</div>
      <div class="stat-value small" id="statTopCountry">—</div>
    </div>
  </div>

  <div class="board">
    <div class="board-top">
      <span class="board-label">סה״כ הוצאות בחו״ל (מומר)</span>
      <button class="refresh-btn" id="refreshRates">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
        רענון שערים
      </button>
    </div>
    <div style="display:flex;align-items:center;">
      <span class="board-currency" id="totalCurrencyLabel">ILS</span>
      <div class="flap-row" id="totalFlaps"></div>
    </div>
    <div class="rate-ticker" id="rateTicker"></div>
    <div class="loading-note" id="rateStatus"></div>
  </div>

  <div class="panel">
    <h2>הוספת הוצאה</h2>
    <div class="form-grid">
      <div>
        <label>תאריך</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label>סכום</label>
        <input type="number" id="fAmount" step="0.01" min="0" placeholder="0.00">
      </div>
      <div>
        <label>מטבע</label>
        <select id="fCurrency"></select>
      </div>
      <div>
        <label>מדינה</label>
        <input type="text" id="fCountry" list="countryList" placeholder="לדוגמה: תאילנד">
        <datalist id="countryList"></datalist>
      </div>
      <div>
        <label>קטגוריה</label>
        <select id="fCategory">
          <option value="מזון">מזון</option>
          <option value="תחבורה">תחבורה</option>
          <option value="לינה">לינה</option>
          <option value="בילויים">בילויים</option>
          <option value="קניות">קניות</option>
          <option value="בריאות">בריאות</option>
          <option value="אחר">אחר</option>
        </select>
      </div>
      <div>
        <label>הערה (אופציונלי)</label>
        <input type="text" id="fNote" placeholder="לדוגמה: ארוחת ערב">
      </div>
      <div>
        <label>שער ידני (אופציונלי - משאיר ריק לשער אוטומטי)</label>
        <input type="number" id="fManualRate" step="0.0001" placeholder="3.06">
      </div>
    </div>
    <div class="currency-add">
      <label style="font-size:12px;color:var(--text-faint);">מטבע חדש לרשימה:</label>
      <input type="text" id="newCurCode" maxlength="3" placeholder="USD">
      <button class="btn-secondary" id="addCurBtn">הוסף מטבע</button>
    </div>
    <div class="add-row">
      <span class="form-msg" id="formMsg"></span>
      <button class="btn-primary" id="addExpenseBtn">הוסף הוצאה</button>
    </div>
  </div>

  <div class="panel">
    <h2>פילוח <span class="n">לפי קטגוריה, מדינה ומטבע</span></h2>
    <div class="breakdown-grid">
      <div class="breakdown-col"><h3>קטגוריה</h3><div id="categoryBreakdown"></div></div>
      <div class="breakdown-col"><h3>מדינה</h3><div id="countryBreakdown"></div></div>
      <div class="breakdown-col"><h3>מטבע</h3><div id="currencyBreakdown"></div></div>
    </div>
  </div>

  <div class="panel">
    <h2>יומן הוצאות <span class="n" id="ledgerCount"></span></h2>
    <div id="ledgerList"></div>
  </div>

  <div class="footer-note">
    השערים מתעדכנים אוטומטית מול שירות שערי חליפין חיצוני (שערים נוכחיים בלבד).<br>
    כל הנתונים נשמרים בדפדפן שלך בלבד.
  </div>

</div>

<script>
/* ---------- storage abstraction: works inside Claude artifacts (window.storage)
   and also as a standalone deployed website (falls back to localStorage) ---------- */
const CLAUDE_STORAGE = (typeof window !== 'undefined' && !!window.storage);

const Store = {
  async get(key){
    if(CLAUDE_STORAGE){
      try{
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }catch(e){ return null; }
    } else {
      try{ return localStorage.getItem(key); }catch(e){ return null; }
    }
  },
  async set(key, value){
    if(CLAUDE_STORAGE){
      try{ await window.storage.set(key, value, false); }catch(e){ console.error('storage set failed', e); }
    } else {
      try{ localStorage.setItem(key, value); }catch(e){ console.error('storage set failed', e); }
    }
  }
};

const COMMON_CURRENCIES = ["ILS","USD","EUR","GBP","JPY","THB","AED","CHF","AUD","CAD","TRY","INR","BRL","ARS","CLP","PEN","COP","CNY","KRW","SGD","MYR","IDR","PHP","TWD","HKD","VND"];
const COMMON_COUNTRIES = [
  "תאילנד","יוון","איטליה","ספרד","פורטוגל","צרפת","גרמניה","בריטניה","ארה״ב","טורקיה","גאורגיה","הודו","וייטנאם","יפן","הולנד","קפריסין","קרואטיה","מרוקו",
  "ברזיל","ארגנטינה","צ׳ילה","פרו","קולומביה","אורוגוואי","בוליביה","אקוודור","פרגוואי","ונצואלה",
  "סין","דרום קוריאה","טאיוואן","סינגפור","מלזיה","אינדונזיה","פיליפינים","קמבודיה","לאוס","הונג קונג","הרפובליקה הדומיניקנית"
];

let state = {
  homeCurrency: "ILS",
  currencies: ["USD","EUR"],
  expenses: [],
  tripName: ""
};
let rateCache = {};

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

async function loadState(){
  try{
    const raw = await Store.get('trip-data');
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ /* first run, no data yet */ }
  try{
    const raw = await Store.get('rate-cache');
    if(raw) rateCache = JSON.parse(raw);
  }catch(e){ /* no cache yet */ }
}

async function saveState(){ await Store.set('trip-data', JSON.stringify(state)); }
async function saveRateCache(){ await Store.set('rate-cache', JSON.stringify(rateCache)); }

async function getRate(date, from, to, manualRate = null){
  if(from === to) return 1;

  // Use manual rate if provided
  if(manualRate !== null && manualRate !== undefined) {
    console.log(`Using manual rate for ${from} -> ${to}: ${manualRate}`);
    return manualRate;
  }

  const key = date + '_' + from + '_' + to;
  if(rateCache[key] !== undefined) {
    console.log(`Using cached rate for ${from} -> ${to} on ${date}: ${rateCache[key]}`);
    return rateCache[key];
  }

  console.log(`Fetching current rate for ${from} -> ${to} (using current rates for all dates)`);

  try{
    // Use exchangerate-api for current rates (free, no API key needed, supports CORS)
    const url = `https://api.exchangerate-api.com/v4/latest/${from}`;
    console.log(`Fetching from: ${url}`);
    const res = await fetch(url, {
      method: 'GET',
      mode: 'cors',
      cache: 'no-cache'
    });
    const data = await res.json();
    console.log(`API response:`, data);
    const rate = data && data.rates && data.rates[to];
    if(rate){
      rateCache[key] = rate;
      saveRateCache();
      console.log(`Got rate: ${rate}`);
      return rate;
    } else {
      console.log(`No rate found in response for ${to}`);
    }
  }catch(e){
    console.error('exchangerate-api failed:', e);
    // Try alternative API as fallback
    try{
      const url = `https://open.er-api.com/v6/latest/${from}`;
      console.log(`Trying fallback API: ${url}`);
      const res = await fetch(url, {
        method: 'GET',
        mode: 'cors',
        cache: 'no-cache'
      });
      const data = await res.json();
      console.log(`Fallback API response:`, data);
      const rate = data && data.rates && data.rates[to];
      if(rate){
        rateCache[key] = rate;
        saveRateCache();
        console.log(`Got fallback rate: ${rate}`);
        return rate;
      }
    }catch(e2){ console.error('Fallback API also failed:', e2); }
  }
  return null;
}

function populateSelect(sel, list, selected){
  sel.innerHTML = '';
  list.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    if(c === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}

function renderHomeSelect(){
  populateSelect(document.getElementById('homeCurrency'), COMMON_CURRENCIES, state.homeCurrency);
}

function renderCurrencySelect(){
  const sel = document.getElementById('fCurrency');
  const list = state.currencies.filter(c=>c!==state.homeCurrency);
  populateSelect(sel, list.length ? list : state.currencies, list[0] || state.currencies[0]);
}

function renderCountryList(){
  const dl = document.getElementById('countryList');
  const used = [...new Set(state.expenses.map(e=>e.country).filter(Boolean))];
  const combined = [...new Set([...used, ...COMMON_COUNTRIES])];
  dl.innerHTML = '';
  combined.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c;
    dl.appendChild(opt);
  });
}

function renderFlaps(total){
  const container = document.getElementById('totalFlaps');
  const rounded = Math.round(total).toString();
  const digits = rounded.split('');
  const prevDigits = container.dataset.prev ? container.dataset.prev.split('') : [];
  container.innerHTML = '';
  digits.forEach((d,i)=>{
    const tile = document.createElement('div');
    tile.className = 'flap-tile';
    tile.textContent = d;
    if(prevDigits[i] !== d) tile.classList.add('flip');
    container.appendChild(tile);
  });
  container.dataset.prev = rounded;
  document.getElementById('totalCurrencyLabel').textContent = state.homeCurrency;
}

async function computeConversions(){
  for(const exp of state.expenses){
    if(exp.currency === state.homeCurrency){
      exp._converted = exp.amount;
    } else {
      const rate = await getRate(exp.date, exp.currency, state.homeCurrency, exp.manualRate);
      exp._converted = rate ? parseFloat((exp.amount * rate).toFixed(2)) : null;
    }
  }
}

async function renderRateTicker(){
  const ticker = document.getElementById('rateTicker');
  const status = document.getElementById('rateStatus');
  ticker.innerHTML = '';
  const list = state.currencies.filter(c=>c!==state.homeCurrency);
  console.log('Rendering rate ticker for currencies:', list);
  if(list.length === 0){
    ticker.innerHTML = '<span class="rate-empty">הוסף מטבע כדי לראות שער יומי</span>';
    status.textContent = '';
    return;
  }
  status.textContent = 'טוען שערים...';
  const today = todayStr();
  for(const cur of list){
    console.log(`Fetching rate for ${cur} to ${state.homeCurrency}`);
    const rate = await getRate(today, cur, state.homeCurrency);
    console.log(`Got rate for ${cur}:`, rate);
    const chip = document.createElement('div');
    chip.className = 'rate-chip';
    chip.innerHTML = `
      <span class="pair">1 ${cur} =</span>
      <span class="val">${rate ? rate.toFixed(3) : '—'} ${state.homeCurrency}</span>
      <button class="rate-delete-btn" data-currency="${cur}" title="מחק מטבע">✕</button>
    `;
    ticker.appendChild(chip);
    console.log(`Added chip for ${cur}`);
  }
  status.textContent = 'עודכן לתאריך ' + today;
  console.log('Rate ticker rendering complete');

  // Add delete button listeners
  ticker.querySelectorAll('.rate-delete-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const currency = btn.dataset.currency;

      // Check if currency is used in expenses
      const usedInExpenses = state.expenses.some(e => e.currency === currency);
      if(usedInExpenses){
        document.getElementById('formMsg').textContent = 'לא ניתן למחוק מטבע שמשמש בהוצאות';
        setTimeout(() => { document.getElementById('formMsg').textContent = ''; }, 3000);
        return;
      }

      state.currencies = state.currencies.filter(c => c !== currency);
      await saveState();
      renderCurrencySelect();
      // Clear cache for the removed currency
      Object.keys(rateCache).forEach(key => {
        if(key.includes(currency)) delete rateCache[key];
      });
      await saveRateCache();
      await renderRateTicker();
      document.getElementById('formMsg').textContent = `המטבע ${currency} נמחק בהצלחה`;
      setTimeout(() => { document.getElementById('formMsg').textContent = ''; }, 2000);
    });
  });
}

function sumByKey(expenses, keyFn, labelForEmpty){
  const map = {};
  expenses.forEach(exp=>{
    if(exp._converted === null || exp._converted === undefined) return;
    const k = keyFn(exp) || labelForEmpty;
    map[k] = (map[k]||0) + exp._converted;
  });
  return map;
}

function renderBarBreakdown(containerId, map, total){
  const div = document.getElementById(containerId);
  div.innerHTML = '';
  const keys = Object.keys(map).sort((a,b)=>map[b]-map[a]);
  if(keys.length === 0){
    div.innerHTML = '<div class="ledger-empty" style="padding:8px 0;">אין עדיין נתונים</div>';
    return;
  }
  keys.forEach(k=>{
    const pct = total ? (map[k]/total*100) : 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `<span class="bar-label" title="${k}">${k}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-val">${map[k].toFixed(2).toLocaleString()} ${state.homeCurrency}</span>`;
    div.appendChild(row);
  });
}

function renderBreakdown(){
  const converted = state.expenses.filter(e=>e._converted !== null && e._converted !== undefined);
  const total = converted.reduce((s,e)=>s+e._converted,0);

  const catMap = sumByKey(state.expenses, e=>e.category, 'אחר');
  renderBarBreakdown('categoryBreakdown', catMap, total);

  const countryMap = sumByKey(state.expenses, e=>e.country, 'ללא ציון');
  renderBarBreakdown('countryBreakdown', countryMap, total);

  const curDiv = document.getElementById('currencyBreakdown');
  const curMap = {};
  state.expenses.forEach(exp=>{
    curMap[exp.currency] = curMap[exp.currency] || {sum:0,count:0};
    curMap[exp.currency].sum += exp.amount;
    curMap[exp.currency].count += 1;
  });
  curDiv.innerHTML = '';
  const curs = Object.keys(curMap);
  if(curs.length === 0){
    curDiv.innerHTML = '<div class="ledger-empty" style="padding:8px 0;">אין עדיין נתונים</div>';
  } else {
    curs.sort((a,b)=>curMap[b].sum-curMap[a].sum).forEach(cur=>{
      const row = document.createElement('div');
      row.className = 'cur-row';
      row.innerHTML = `<span class="cur-name">${cur} · ${curMap[cur].count}</span><span class="cur-amt">${curMap[cur].sum.toLocaleString()}</span>`;
      curDiv.appendChild(row);
    });
  }

  // stat strip
  document.getElementById('statCount').textContent = state.expenses.length;
  document.getElementById('statAvg').textContent = converted.length
    ? (total/converted.length).toFixed(2).toLocaleString() + ' ' + state.homeCurrency
    : '—';
  const topCat = Object.keys(catMap).sort((a,b)=>catMap[b]-catMap[a])[0];
  document.getElementById('statTopCat').textContent = topCat || '—';
  const topCountry = Object.keys(countryMap).sort((a,b)=>countryMap[b]-countryMap[a])[0];
  document.getElementById('statTopCountry').textContent = topCountry || '—';
}

function renderLedger(){
  const list = document.getElementById('ledgerList');
  const countLabel = document.getElementById('ledgerCount');
  const sorted = [...state.expenses].sort((a,b)=> b.date.localeCompare(a.date));
  countLabel.textContent = sorted.length ? `(${sorted.length})` : '';
  list.innerHTML = '';
  if(sorted.length === 0){
    list.innerHTML = '<div class="ledger-empty">עדיין לא נוספו הוצאות. תוסיף את הראשונה למעלה.</div>';
    return;
  }

  // Group by country
  const byCountry = {};
  sorted.forEach(exp=>{
    const country = exp.country || 'ללא ציון מדינה';
    if(!byCountry[country]) byCountry[country] = [];
    byCountry[country].push(exp);
  });

  // Render each country section
  Object.keys(byCountry).forEach(country => {
    const expenses = byCountry[country];
    const totalConverted = expenses.reduce((sum, e) => sum + (e._converted !== null && e._converted !== undefined ? e._converted : 0), 0);
    const totalCount = expenses.length;
    const countryCode = country === 'ללא ציון מדינה' ? '?' : country.slice(0, 2).toUpperCase();

    const section = document.createElement('div');
    section.className = 'country-section';

    const header = document.createElement('div');
    header.className = 'country-header';
    header.innerHTML = `
      <div class="country-name">
        <div class="country-flag">${countryCode}</div>
        ${escapeHtml(country)}
      </div>
      <div class="country-stats">
        <div class="country-stat">
          <span class="val">${totalCount}</span> הוצאות
        </div>
        <div class="country-stat">
          סה״כ: <span class="val">${totalConverted.toFixed(2).toLocaleString()} ${state.homeCurrency}</span>
        </div>
      </div>
    `;

    const content = document.createElement('div');
    content.className = 'country-content';

    expenses.forEach(exp => {
      const row = document.createElement('div');
      row.className = 'ledger-item';
      const convText = exp._converted !== null && exp._converted !== undefined
        ? exp._converted.toFixed(2).toLocaleString() + ' ' + state.homeCurrency
        : '—';
      row.innerHTML = `
        <span class="ledger-date">${exp.date.slice(5)}</span>
        <span class="ledger-mid">
          <span class="ledger-tags">
            <span class="ledger-cat">${exp.category}</span>
          </span>
          ${exp.note ? `<span class="ledger-note">${escapeHtml(exp.note)}</span>` : ''}
        </span>
        <span class="ledger-orig">${exp.amount.toLocaleString()} ${exp.currency}</span>
        <span class="ledger-conv">${convText}</span>
        <button class="del-btn" data-id="${exp.id}" title="מחיקה" aria-label="מחיקת הוצאה">✕</button>
      `;
      content.appendChild(row);
    });

    // Toggle collapse
    header.addEventListener('click', () => {
      content.classList.toggle('collapsed');
    });

    section.appendChild(header);
    section.appendChild(content);
    list.appendChild(section);
  });

  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.expenses = state.expenses.filter(e=>e.id !== btn.dataset.id);
      await saveState();
      await refreshAll();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function refreshAll(){
  await computeConversions();
  const total = state.expenses.reduce((s,e)=> s + (e._converted || 0), 0);
  renderFlaps(total);
  renderBreakdown();
  renderLedger();
  renderCountryList();
}

document.getElementById('tripName').addEventListener('change', async (e)=>{
  state.tripName = e.target.value.trim();
  await saveState();
});

document.getElementById('homeCurrency').addEventListener('change', async (e)=>{
  state.homeCurrency = e.target.value;
  await saveState();
  renderCurrencySelect();
  await renderRateTicker();
  await refreshAll();
});

document.getElementById('addCurBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('newCurCode');
  const code = input.value.trim().toUpperCase();
  if(code.length !== 3){
    document.getElementById('formMsg').textContent = 'קוד מטבע צריך להיות 3 אותיות (למשל USD)';
    return;
  }
  if(!state.currencies.includes(code)) state.currencies.push(code);
  input.value = '';
  document.getElementById('formMsg').textContent = '';
  await saveState();
  renderCurrencySelect();
  // Clear cache for the new currency to force refresh
  Object.keys(rateCache).forEach(key => {
    if(key.includes(code)) delete rateCache[key];
  });
  await saveRateCache();
  await renderRateTicker();
});

document.getElementById('refreshRates').addEventListener('click', async (e)=>{
  const btn = e.currentTarget;
  btn.classList.add('spinning');
  rateCache = {};
  await saveRateCache();
  await renderRateTicker();
  await refreshAll();
  btn.classList.remove('spinning');
  document.getElementById('formMsg').textContent = 'ה-cache נוקה והשערים רועננו';
  setTimeout(() => { document.getElementById('formMsg').textContent = ''; }, 2000);
});

document.getElementById('addExpenseBtn').addEventListener('click', async ()=>{
  const date = document.getElementById('fDate').value || todayStr();
  const amount = parseFloat(document.getElementById('fAmount').value);
  const currency = document.getElementById('fCurrency').value;
  const country = document.getElementById('fCountry').value.trim();
  const category = document.getElementById('fCategory').value;
  const note = document.getElementById('fNote').value.trim();
  const manualRateInput = document.getElementById('fManualRate').value;
  const msg = document.getElementById('formMsg');

  if(!amount || amount <= 0){
    msg.textContent = 'צריך להזין סכום חוקי';
    return;
  }
  msg.textContent = '';

  const exp = {
    id: Date.now().toString() + Math.random().toString(36).slice(2,7),
    date, amount, currency, country, category, note
  };

  // Add manual rate if provided
  if(manualRateInput && manualRateInput.trim() !== ''){
    const manualRate = parseFloat(manualRateInput);
    if(!isNaN(manualRate) && manualRate > 0){
      exp.manualRate = manualRate;
    }
  }

  state.expenses.push(exp);
  await saveState();

  document.getElementById('fAmount').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fManualRate').value = '';
  document.getElementById('fCountry').value = country; // keep last country for convenience

  await refreshAll();
  if(exp.manualRate){
    document.getElementById('formMsg').textContent = 'הוצאה נוספה עם שער ידני';
    setTimeout(() => { document.getElementById('formMsg').textContent = ''; }, 2000);
  }
});

async function init(){
  await loadState();
  // Clear cache to force refresh with new API
  rateCache = {};
  await saveRateCache();
  document.getElementById('fDate').value = todayStr();
  document.getElementById('tripName').value = state.tripName || '';
  renderHomeSelect();
  renderCurrencySelect();
  renderCountryList();
  await renderRateTicker();
  await refreshAll();
}

init();
</script>
</body>
</html>
